<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tugas Kuliahku</title>
<style>
:root{--bg:#f3f5f1;--card:#fff;--ink:#1f2a24;--mute:#6b776f;--line:#dde3dc;--acc:#2f6f5e;--warn:#c0392b;--soon:#b9770e;--fs:16px}
:root[data-t=dark]{--bg:#141a17;--card:#1e2622;--ink:#e8eee9;--mute:#98a59c;--line:#2d3732;--warn:#ec7063;--soon:#e0a847}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.5 Georgia,"Times New Roman",serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 64px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:1.9em;margin:0}
.sub{color:var(--mute);margin:2px 0 16px}
input,select,button,textarea{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
button{cursor:pointer}
.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:bold}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.chips{display:flex;gap:8px;flex-wrap:wrap;font-size:.9em;color:var(--mute)}
.chips b{color:var(--ink)}
.courses{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:.9em}
.crs{display:flex;justify-content:space-between;gap:8px}
.top{display:flex;gap:8px;margin-bottom:10px}
.top input{flex:1;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{white-space:nowrap;border-radius:20px;padding:6px 12px;font-size:.9em}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px}
.item.p2{border-left-color:var(--warn)}.item.p1{border-left-color:var(--soon)}.item.p0{border-left-color:var(--acc)}
.item input[type=checkbox]{width:22px;height:22px;margin-top:3px;accent-color:var(--acc);flex:none;padding:0}
.body{flex:1;min-width:0}
.name{font-weight:bold;word-break:break-word}
.meta{color:var(--mute);font-size:.88em}
.note{font-size:.9em;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.item.done .name{text-decoration:line-through;color:var(--mute)}
.late{color:var(--warn)}.soon{color:var(--soon)}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.row select{padding:5px 8px;font-size:.88em}
.lnk{color:var(--acc);font-size:.88em}
.sm{border:0;background:none;color:var(--mute);padding:4px 6px;font-size:.88em}
.empty{text-align:center;color:var(--mute);padding:28px 0}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(440px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 12px;font-size:1.25em}
label{display:block;font-size:.9em;color:var(--mute);margin:10px 0 4px}
dialog input,dialog select,dialog textarea{width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.sw{display:flex;gap:10px}
.sw input{display:none}
.sw span{display:block;width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw input:checked+span{border-color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:1em;margin:12px 0 0}
.chk input{width:auto}
</style>
</head>
<body>
<main>
<header>
<div><h1>Tugas Kuliahku</h1><p class="sub" id="hi"></p></div>
<button id="bset" aria-label="Buka pengaturan">Pengaturan</button>
</header>

<div class="card">
<div id="ptext"></div>
<div class="bar"><i id="pbar"></i></div>
<div class="chips" id="chips"></div>
<div class="courses" id="crs"></div>
</div>

<div class="top">
<input id="q" type="search" placeholder="Cari tugas...">
<select id="fc"></select>
<button class="pri" id="badd">Tambah</button>
</div>
<div class="tabs" id="tabs"></div>
<div id="list"></div>
</main>

<dialog id="dt">
<form id="ft" method="dialog">
<h2 id="dtt">Tambah tugas</h2>
<label for="n">Nama tugas</label><input id="n" required>
<div class="g2">
<div><label for="c">Mata kuliah</label><input id="c" list="cl"><datalist id="cl"></datalist></div>
<div><label for="d">Deadline</label><input id="d" type="date"></div>
<div><label for="p">Prioritas</label><select id="p"><option value="0">Biasa</option><option value="1">Penting</option><option value="2">Mendesak</option></select></div>
<div><label for="s">Status</label><select id="s"></select></div>
</div>
<label for="l">Link (Drive, e-learning, dll)</label><input id="l" type="url" placeholder="https://">
<label for="o">Catatan</label><textarea id="o" rows="3"></textarea>
<div class="acts"><button type="button" id="cx">Batal</button><button class="pri" type="submit">Simpan</button></div>
</form>
</dialog>

<dialog id="ds">
<h2>Pengaturan</h2>
<label for="sn">Namamu</label><input id="sn" placeholder="Contoh: Rina">
<label for="st">Tema</label>
<select id="st"><option value="auto">Ikuti perangkat</option><option value="light">Terang</option><option value="dark">Gelap</option></select>
<label>Warna utama</label>
<div class="sw" id="sw"></div>
<label for="so">Urutan daftar</label>
<select id="so"><option value="d">Deadline terdekat</option><option value="p">Prioritas tertinggi</option><option value="n">Tugas terbaru</option><option value="a">Nama A-Z</option></select>
<label for="sf">Ukuran huruf</label>
<select id="sf"><option value="14">Kecil</option><option value="16">Sedang</option><option value="18">Besar</option></select>
<label class="chk"><input type="checkbox" id="sh"> Sembunyikan tugas yang sudah dikumpulkan di tab Semua</label>
<hr style="border:0;border-top:1px solid var(--line);margin:16px 0 4px">
<div class="acts" style="justify-content:flex-start">
<button id="exp">Simpan cadangan</button>
<button id="imp">Pulihkan cadangan</button>
<button id="clr" style="color:var(--warn)">Hapus semua data</button>
<input id="file" type="file" accept=".json" hidden>
</div>
<div class="acts"><button class="pri" id="sx">Selesai</button></div>
</dialog>

<script>
var ST=["Belum mulai","Dikerjakan","Selesai","Sudah dikumpulkan"],PR=["Biasa","Penting","Mendesak"];
var COL=["#2f6f5e","#2b5fa8","#7a4fa3","#c0562b","#b0386b"];
var TK="tugas-kuliah-v1",SK="tugas-kuliah-set";
var tasks=[],set={name:"",theme:"auto",acc:COL[0],sort:"d",size:"16",hide:false},tab="all",editId=null;
try{tasks=JSON.parse(localStorage.getItem(TK)||"[]")}catch(e){}
try{Object.assign(set,JSON.parse(localStorage.getItem(SK)||"{}"))}catch(e){}
var $=function(i){return document.getElementById(i)};
function save(){try{localStorage.setItem(TK,JSON.stringify(tasks));localStorage.setItem(SK,JSON.stringify(set))}catch(e){}}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function todayN(){var t=new Date();t.setHours(0,0,0,0);return t}
function diff(t){return Math.round((new Date(t.d+"T00:00:00")-todayN())/864e5)}

function applySet(){
  var dark=set.theme==="dark"||(set.theme==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches);
  var r=document.documentElement;
  r.dataset.t=dark?"dark":"light";
  r.style.setProperty("--acc",set.acc);r.style.setProperty("--fs",set.size+"px");
}

function dl(t){
  if(!t.d||t.s>=2)return "";
  var x=diff(t);
  if(x<0)return '<span class="late">Terlambat '+(-x)+' hari</span>';
  if(x===0)return '<span class="soon">Hari ini</span>';
  if(x<=3)return '<span class="soon">'+x+' hari lagi</span>';
  return x+' hari lagi';
}

function render(){
  var h=new Date().getHours();
  var sal=h<11?"Selamat pagi":h<15?"Selamat siang":h<18?"Selamat sore":"Selamat malam";
  $("hi").textContent=sal+(set.name?", "+set.name:"")+". Ini daftar tugasmu.";

  var total=tasks.length,fin=tasks.filter(function(t){return t.s>=2}).length,sent=tasks.filter(function(t){return t.s===3}).length;
  var late=tasks.filter(function(t){return t.d&&t.s<2&&diff(t)<0}).length;
  var soon=tasks.filter(function(t){return t.d&&t.s<2&&diff(t)>=0&&diff(t)<=3}).length;
  $("ptext").textContent=fin+" dari "+total+" tugas selesai";
  $("pbar").style.width=(total?fin/total*100:0)+"%";
  $("chips").innerHTML='<span><b>'+sent+'</b> dikumpulkan</span><span><b>'+(total-fin)+'</b> belum selesai</span><span class="late"><b>'+late+'</b> terlambat</span><span class="soon"><b>'+soon+'</b> deadline 3 hari</span>';

  var cs={};tasks.forEach(function(t){var k=t.c||"Tanpa mata kuliah";cs[k]=cs[k]||[0,0];cs[k][1]++;if(t.s>=2)cs[k][0]++});
  var keys=Object.keys(cs);
  $("crs").style.display=keys.length?"":"none";
  $("crs").innerHTML=keys.map(function(k){return '<div class="crs"><span>'+esc(k)+'</span><span>'+cs[k][0]+'/'+cs[k][1]+' selesai</span></div>'}).join("");

  var cur=$("fc").value;
  $("fc").innerHTML='<option value="">Semua matkul</option>'+Object.keys(cs).filter(function(k){return k!=="Tanpa mata kuliah"}).map(function(k){return '<option'+(k===cur?' selected':'')+'>'+esc(k)+'</option>'}).join("");
  $("cl").innerHTML=keys.map(function(k){return '<option value="'+esc(k)+'">'}).join("");

  var tabs=[["all","Semua",total-(set.hide?sent:0)],["0","Belum mulai"],["1","Dikerjakan"],["2","Selesai"],["3","Dikumpulkan"]];
  $("tabs").innerHTML=tabs.map(function(t){
    var n=t[2]!==undefined?t[2]:tasks.filter(function(x){return String(x.s)===t[0]}).length;
    return '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+' ('+n+')</button>'}).join("");

  var q=$("q").value.toLowerCase(),fc=$("fc").value;
  var shown=tasks.filter(function(t){
    if(fc&&t.c!==fc)return false;
    if(q&&(t.n+" "+(t.c||"")+" "+(t.o||"")).toLowerCase().indexOf(q)<0)return false;
    if(tab==="all")return !(set.hide&&t.s===3);
    return String(t.s)===tab;
  });
  shown.sort(function(a,b){
    var r=(a.s>=2)-(b.s>=2);if(r)return r;
    if(set.sort==="p")return (b.p||0)-(a.p||0)||(a.d||"9").localeCompare(b.d||"9");
    if(set.sort==="n")return b.id-a.id;
    if(set.sort==="a")return a.n.localeCompare(b.n);
    return (a.d||"9999").localeCompare(b.d||"9999");
  });

  $("list").innerHTML=shown.length?shown.map(function(t){
    var opts=ST.map(function(s,i){return '<option value="'+i+'"'+(t.s===i?' selected':'')+'>'+s+'</option>'}).join("");
    var meta=[t.c?esc(t.c):"",t.d?new Date(t.d+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}):"",PR[t.p||0],dl(t)].filter(Boolean).join(" · ");
    return '<div class="item p'+(t.p||0)+(t.s>=2?' done':'')+'">'+
      '<input type="checkbox" aria-label="Tandai selesai" data-id="'+t.id+'"'+(t.s>=2?' checked':'')+'>'+
      '<div class="body"><div class="name">'+esc(t.n)+'</div><div class="meta">'+meta+'</div>'+
      (t.o?'<div class="note">'+esc(t.o)+'</div>':'')+
      '<div class="row"><select data-st="'+t.id+'" aria-label="Status">'+opts+'</select>'+
      (t.l?'<a class="lnk" href="'+esc(t.l)+'" target="_blank" rel="noopener">Buka link</a>':'')+
      '<button class="sm" data-ed="'+t.id+'">Edit</button><button class="sm" data-del="'+t.id+'">Hapus</button></div></div></div>';
  }).join(""):'<div class="empty">'+(total?'Tidak ada tugas yang cocok dengan filter ini.':'Belum ada tugas. Klik Tambah untuk mulai.')+'</div>';
}

function openTask(id){
  editId=id;var t=tasks.filter(function(x){return x.id===id})[0]||{};
  $("dtt").textContent=id?"Edit tugas":"Tambah tugas";
  $("n").value=t.n||"";$("c").value=t.c||"";$("d").value=t.d||"";$("p").value=t.p||0;
  $("s").value=t.s||0;$("l").value=t.l||"";$("o").value=t.o||"";
  $("dt").showModal();$("n").focus();
}
$("s").innerHTML=ST.map(function(s,i){return '<option value="'+i+'">'+s+'</option>'}).join("");
$("badd").onclick=function(){openTask(null)};
$("cx").onclick=function(){$("dt").close()};
$("ft").addEventListener("submit",function(){
  var o={n:$("n").value.trim(),c:$("c").value.trim(),d:$("d").value,p:+$("p").value,s:+$("s").value,l:$("l").value.trim(),o:$("o").value.trim()};
  if(!o.n)return;
  if(editId){tasks.forEach(function(t){if(t.id===editId)Object.assign(t,o)})}
  else{o.id=Date.now();tasks.push(o)}
  save();render();
});

$("list").addEventListener("change",function(e){
  var el=e.target,id;
  if(el.dataset.id){id=+el.dataset.id;tasks.forEach(function(t){if(t.id===id)t.s=el.checked?2:0})}
  if(el.dataset.st){id=+el.dataset.st;tasks.forEach(function(t){if(t.id===id)t.s=+el.value})}
  save();render();
});
$("list").addEventListener("click",function(e){
  var d=e.target.dataset;
  if(d.ed)openTask(+d.ed);
  if(d.del&&confirm("Hapus tugas ini?")){tasks=tasks.filter(function(t){return t.id!==+d.del});save();render()}
});
$("tabs").addEventListener("click",function(e){if(e.target.dataset.tab){tab=e.target.dataset.tab;render()}});
$("q").oninput=render;$("fc").onchange=render;

$("sw").innerHTML=COL.map(function(c){return '<label style="margin:0"><input type="radio" name="ac" value="'+c+'"><span style="background:'+c+'"></span></label>'}).join("");
$("bset").onclick=function(){
  $("sn").value=set.name;$("st").value=set.theme;$("so").value=set.sort;$("sf").value=set.size;$("sh").checked=set.hide;
  document.querySelectorAll("[name=ac]").forEach(function(r){r.checked=r.value===set.acc});
  $("ds").showModal();
};
function readSet(){
  set.name=$("sn").value.trim();set.theme=$("st").value;set.sort=$("so").value;set.size=$("sf").value;set.hide=$("sh").checked;
  var a=document.querySelector("[name=ac]:checked");if(a)set.acc=a.value;
  save();applySet();render();
}
["sn","st","so","sf","sh"].forEach(function(i){$(i).addEventListener("change",readSet)});
$("sn").addEventListener("input",readSet);
$("sw").addEventListener("change",readSet);
$("sx").onclick=function(){$("ds").close()};

$("exp").onclick=function(){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify({tasks:tasks,set:set})],{type:"application/json"}));
  a.download="cadangan-tugas.json";a.click();
};
$("imp").onclick=function(){$("file").click()};
$("file").onchange=function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{
    var d=JSON.parse(r.result);
    if(Array.isArray(d))tasks=d;else if(d.tasks){tasks=d.tasks;if(d.set)Object.assign(set,d.set)}else throw 0;
    save();applySet();render();alert("Data berhasil dipulihkan.");
  }catch(e){alert("File cadangan tidak bisa dibaca.")}};
  r.readAsText(f);
};
$("clr").onclick=function(){if(confirm("Hapus SEMUA tugas? Tindakan ini tidak bisa dibatalkan.")){tasks=[];save();render()}};

applySet();render();
</script>
</body>
</html>
